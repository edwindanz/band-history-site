<!DOCTYPE html>
<html>
<head>
    <title>Band History Archive</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        section {
            margin-bottom: 40px;
        }

        h1 {
            color: #333;
        }

        .card {
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<header>
    <h1>Band History Archive</h1>
    <p>History, Members, Albums, Songs, and Videos</p>
</header>

<section>
    <h2>Band History</h2>
    <div class="card">
        Band history will go here.
    </div>
</section>

<section>
    <h2>Members</h2>
    <div class="card">
        Current and former members.
    </div>
</section>

<section>
    <h2>Albums</h2>
    <div class="card">
        Albums listed chronologically.
    </div>
</section>

</body>
</html>
